version: "3"
services:
  janus:
    image: ivadim/fruitnanny-janus
    restart: always
    privileged: true
    network_mode: "host"
    volumes:
      - ./configuration/janus:/etc/janus
      - ./configuration/ssl:/etc/fruitnanny-ssl
      - ./hls:/hls
    expose:
      - 8088 # api http
      - 8089 # api https
      - 5002 # audio
      - 5004 # video

  gstreamer-video:
    image: fruitnanny-gstreamer
    restart: always
    privileged: true
    network_mode: "host"
    depends_on:
      - janus
    command: >
      gst-launch-1.0 -v libcamerasrc !
      video/x-raw,width=960,height=540,framerate=12/1 !
      videoconvert !
      x264enc tune=zerolatency bitrate=1000 key-int-max=24 !
      h264parse !
      mpegtsmux !
      hlssink max-files=5 target-duration=1
      location=/hls/segment%05d.ts
      playlist-location=/hls/stream.m3u8
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /sys:/sys
      - /run/udev:/run/udev:ro
      - ./hls:/hls

  gstreamer-audio:
    image: fruitnanny-gstreamer
    restart: always
    privileged: true
    network_mode: "host"
    depends_on:
      - janus
    devices:
      - "/dev/snd:/dev/snd"
        #command: gst-launch-1.0 -v pulsesrc device=microphone ! audioconvert ! audioresample ! opusenc ! rtpopuspay ! queue max-size-bytes=0 max-size-buffers=0 ! udpsink host=127.0.0.1 port=5002
    command: "/audio_entry.sh"

  fruitnanny:
    image: ivadim/fruitnanny-app
    restart: always
    privileged: true
    volumes:
      - ./fruitnanny_config.js:/opt/fruitnanny/fruitnanny_config.js
      - ./bin:/opt/fruitnanny/bin
      - ./views:/opt/fruitnanny/views
      - ./public:/opt/fruitnanny/public
      - ./server:/opt/fruitnanny/server
    network_mode: "host"
    depends_on:
      - janus
    expose:
      - 7000

  nginx:
    image: arm32v6/nginx:alpine
    restart: always
    network_mode: "host"
    depends_on:
      - janus
      - fruitnanny
    volumes:
      - ./configuration/nginx/fruitnanny_http:/etc/nginx/conf.d/default.conf
      - ./configuration/nginx/fruitnanny_https:/etc/nginx/conf.d/default-ssl.conf
      - ./configuration/nginx/.htpasswd:/etc/nginx/.htpasswd
      - ./configuration/ssl:/etc/fruitnanny-ssl
      - ./hls:/hls
    ports:
      - "80:80"
      - "443:443"
